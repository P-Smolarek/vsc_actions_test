# This is a basic workflow to help you get started with Actions
name: pierwszy_przeplyw

# Controls when the workflow will run
on:
  push:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  moje_pierwsze_zadanie:
    runs-on: debian13_runner1

    steps:
      - name: Sprawdzamy wersję Python
        run: python -V

      - name: Wyświetl aktualny katalog roboczy
        run: pwd

      - name: Wyświetl listę plików
        run: ls -a

      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      - name: Wyświetl listę plików po checkout
        run: ls -a
        
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.16.0-alpha.2'

      - name: Sprawdzamy wersję Python po instalacji
        run: python -V
